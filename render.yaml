# Render web service. Set the MYSQL_* variables to connect to Aiven MySQL.
databases:
  - name: fitnesszone-db
    databaseName: fitforge
    plan: free

services:
  - type: web
    name: fitnesszone
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn fitforge.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SITE_NAME
        value: FITNESS ZONE
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitnesszone-db
          property: connectionString
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
