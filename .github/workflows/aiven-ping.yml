name: Keep Aiven MySQL active

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check database settings and install CA certificate
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_SSL_CA_PEM: ${{ secrets.MYSQL_SSL_CA }}
        run: |
          for name in MYSQL_HOST MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_SSL_CA_PEM; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          ca_file="$RUNNER_TEMP/aiven-ca.pem"
          printf '%s' "$MYSQL_SSL_CA_PEM" > "$ca_file"
          echo "MYSQL_SSL_CA=$ca_file" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MySQL connector
        run: python -m pip install mysql-connector-python

      - name: Ping Aiven MySQL
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: python -m scripts.ping_aiven
