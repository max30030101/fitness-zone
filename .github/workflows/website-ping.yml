name: Keep website awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping website
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          if [ -z "$WEBSITE_URL" ]; then
            echo "Set the WEBSITE_URL repository variable to your public website URL."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --max-time 60 --output /dev/null \
            --write-out 'Website ping returned HTTP %{http_code}\n' \
            "$WEBSITE_URL"
